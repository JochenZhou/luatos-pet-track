name: Build App & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  web:
    name: 构建 Web 产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 构建 index.html（合并注入）
        run: |
          python3 build_deploy.py
          node smoke-test.js

      - name: 上传 Web 产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: |
            index.html
            login.html

  android:
    name: 打包 Android APK
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle') }}
          restore-keys: gradle-

      - name: 构建 Release APK（固定 keystore 签名，可直接安装/覆盖升级）
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon -x lint \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/keystore/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: 验证 APK 已签名
        run: |
          APK=$(find "$GITHUB_WORKSPACE" -name "*.apk" -path "*release*" 2>/dev/null | head -1)
          echo "APK: $APK"
          # apksigner 验证
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | head -5

      - name: 重命名 APK
        run: |
          mkdir -p dist
          APK=$(find "$GITHUB_WORKSPACE/build" android/build -name "*.apk" -path "*release*" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then APK=$(find "$GITHUB_WORKSPACE" -name "*.apk" -path "*release*" 2>/dev/null | head -1); fi
          echo "APK found: $APK"
          cp "$APK" "dist/luatos-pet-track.apk"
          ls -la dist/

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk

  release:
    name: 发布 Release（仅 tag 触发）
    runs-on: ubuntu-latest
    needs: [web, android]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 列出产物
        run: find artifacts -type f | head -20

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/apk/*.apk
            artifacts/web-dist/index.html
            artifacts/web-dist/login.html