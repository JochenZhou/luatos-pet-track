// app/build.gradle
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jochen.luatos_pet_track'
    compileSdk 34

    defaultConfig {
        applicationId "com.jochen.luatos_pet_track"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "0.3.0"
    }

    // 无签名配置：CI 产出未签名 release APK；本地可加 signingConfigs
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}