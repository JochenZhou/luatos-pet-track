// app/build.gradle
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jochen.luatos_pet_track'
    compileSdk 34

    defaultConfig {
        applicationId "com.jochen.luatos_pet_track"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "0.3.3"
    }

    // 无签名配置：CI 产出未签名 release APK；本地可加 signingConfigs
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    // 修复 kotlin-stdlib 与 jdk7/jdk8 传递依赖的重复类冲突（统一 1.8.22）
    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22') {
            because 'align kotlin stdlib versions'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22') {
            because 'align kotlin stdlib versions'
        }
    }
}